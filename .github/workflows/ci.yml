name: Verify delivery assurance lab
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql://fda:fda_test@127.0.0.1:5432/fda_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fda
          POSTGRES_PASSWORD: fda_test
          POSTGRES_DB: fda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fda -d fda_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test and capture the application interface
        env:
          LAB_SCREENSHOTS_DIR: test-results/interface
          LAB_SCREENSHOT_REVISION: ${{ github.sha }}
        run: npm run test:e2e
      - name: Upload application screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-interface
          path: test-results/interface/
          if-no-files-found: warn
      - run: npm run test:e2e:private
      - name: Generate synthetic evidence
        env:
          LAB_SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/export-review-evidence.ts test-results/review-evidence
      - name: Upload synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-review-evidence
          path: test-results/review-evidence/
          if-no-files-found: error
      - name: Verify disposable PostgreSQL backup and restore
        run: bash scripts/verify-backup-ci.sh "${{ job.services.postgres.id }}"
      - name: Build and check the deployment image
        run: |
          docker build -t fda-release .
          docker run --rm --entrypoint node fda-release --input-type=module -e '
            import { access } from "node:fs/promises";
            await import("./backend/dist/backend/src/api/app.js");
            await access("frontend/dist/index.html");
            await access("database/migrations/009_downstream_operations.sql");
            await access("database/migrations/010_adoption_assurance.sql");
            await access("database/migrations/011_outcome_assurance.sql");
            await access("database/migrations/012_ai_investigations.sql");
            await import("./backend/dist/backend/src/api/investigations.js");
            await import("./backend/dist/backend/src/modules/investigations/provider.js");
            await access("backend/dist/backend/src/modules/investigations/service.js");
            await access("backend/dist/shared/contracts/investigations.js");
            await import("./backend/dist/backend/src/api/outcome-assurance.js");
            await access("backend/dist/backend/src/modules/outcomes/assurance.js");
            await access("backend/dist/shared/contracts/outcome-assurance.js");
            await access("backend/dist/backend/src/workers/downstream.js");
            await access("backend/dist/backend/src/downstream-simulator.js");
            await access("backend/dist/backend/src/workers/run.js");
            await access("database/migrations/005_evidence_provenance.sql");
            await access("database/migrations/006_fda_ingestion.sql");
            await import("./backend/dist/backend/src/api/fda-ingestion.js");
          '
