name: Verify delivery assurance lab
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://fda:fda_test@127.0.0.1:5432/fda_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fda
          POSTGRES_PASSWORD: fda_test
          POSTGRES_DB: fda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fda -d fda_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
